name: Build and deploy Node.js app to Azure Web App - backend04

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Install jq (debug)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Debug OIDC token claims
        run: |
          echo "OIDC token claims (for debugging federated credential subject):"
          curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq '.'
        # Uses built-in environment variables provided by GitHub Actions when
        # `permissions.id-token` is set to `write`.

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6E1AE79A1C1945438423A16889AAD56E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A2AF10156FB945158E50792DEA58B2DB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_63EFEA90D581413E8458974382FD4EE8 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'backend04'
          slot-name: 'Production'
          package: .
